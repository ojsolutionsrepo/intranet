# OJ Intranet — XAMPP Apache vhost
#
# 1. Ensure this line is active in C:\xampp\apache\conf\httpd.conf:
#      Include conf/extra/httpd-vhosts.conf
# 2. Append the block below to C:\xampp\apache\conf\extra\httpd-vhosts.conf
#    (or: Include "C:/xampp/htdocs/intranet/apache/vhost.conf")
# 3. Add to C:\Windows\System32\drivers\etc\hosts (as Administrator):
#      127.0.0.1  intranet.local
# 4. Set APP_URL=http://intranet.local in .env
# 5. Restart Apache from the XAMPP Control Panel

<VirtualHost *:80>
    ServerName intranet.local
    DocumentRoot "C:/xampp/htdocs/intranet/public"

    <Directory "C:/xampp/htdocs/intranet/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "C:/xampp/apache/logs/intranet-error.log"
    CustomLog "C:/xampp/apache/logs/intranet-access.log" common
</VirtualHost>
