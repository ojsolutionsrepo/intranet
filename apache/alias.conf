# Serve Laravel's public/ at http://localhost/intranet (or http://SERVER/intranet)
#
# Remote / fresh XAMPP setup:
# 1. Enable rewrite: in httpd.conf uncomment LoadModule rewrite_module
# 2. Include this file from C:\xampp\apache\conf\extra\httpd-vhosts.conf:
#      Include "C:/xampp/htdocs/intranet/apache/alias.conf"
#    (edit the path if the project is not under C:/xampp/htdocs/intranet)
# 3. Ensure AllowOverride All for the Directory block below (required for .htaccess)
# 4. Restart Apache
# 5. Open http://localhost/intranet/install
#
# Without this Alias, root .htaccess falls back to public/ — also supported after
# bootstrap/fix-subdirectory.php — but Alias is the recommended path.

Alias /intranet "C:/xampp/htdocs/intranet/public"

<Directory "C:/xampp/htdocs/intranet/public">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
